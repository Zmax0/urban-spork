[package]
name = "urban-spork-jni"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ciphers"
crate-type = ["cdylib"]
path = "src/ciphers.rs"

[dependencies]
jni = "0.22.4"
aes = "0.9.3"
aes-gcm = "0.11.1"
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", features = ["reduced-round"] }
shake = "0.1.0"
